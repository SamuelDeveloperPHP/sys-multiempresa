<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGA - Modo Offline</title>
    <link rel="icon" href="/icons/icon-192.png">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #1abc9c 0%, #00BCD4 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1a2632; }
        .card { background: #fff; border-radius: 16px; padding: 32px 28px; max-width: 360px; width: 88%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
        .icon { font-size: 64px; margin-bottom: 12px; }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 20px; color: #5b6770; font-size: 14px; line-height: 1.5; }
        button { background: #557bbb; color: #fff; border: 0; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { background: #3f63a0; }
        .links { margin-top: 16px; font-size: 12px; color: #888; }
        .links a { color: #557bbb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Você está offline</h1>
        <p>Não foi possível carregar essa página. Verifique sua conexão ou continue trabalhando com os dados em cache.</p>
        <button onclick="window.location.reload()">Tentar novamente</button>
        <div class="links">
            <a href="/mobile/veiculos">Ir para Veículos (offline)</a>
        </div>
    </div>
</body>
</html>
